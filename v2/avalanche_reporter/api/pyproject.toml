[tool.poetry]
name        = "avalanche-api"
version     = "0.1.0"
description = "FastAPI service exposing TOPR avalanche bulletins"
authors     = ["mikolaj.grzegorzek@protonmail.com"]
readme      = "README.md"
packages    = [{include = "app"}]

[tool.poetry.dependencies]
python      = "^3.9"
fastapi     = {extras = ["all"], version = "^0.109"}
uvicorn     = {extras = ["standard"], version = "^0.27"}
pandas      = "^2.2"
sqlalchemy = "^2.0.40"
boto3      = "^1.31"

[tool.poetry.group.dev.dependencies]
# optional: lint / test tools
black   = "^24.3"
ruff    = "^0.3"
pytest  = "^8.1"

[build-system]
requires      = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
